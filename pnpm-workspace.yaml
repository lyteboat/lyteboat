packages:
  # lyteboat/<layer>/<package>: one directory per architecture layer; dependencies point
  # down only (scripts/check-layers.ts enforces it): apps own processes (the `lyteboat`
  # bin), bundles are compositions a profile includes by name, plugins are
  # capabilities on the dsh seams, core are declarations, test-support is test infrastructure.
  # examples/<kind>/<package> build on it; it never names them.
  - lyteboat/*/*
  - examples/*/*
  # dsh/<group>/<package>: the kernel (dsh/kernel.json), imported per tag under its published names.
  - dsh/*/*

# Every kernel package resolves to its workspace copy, for lyteboat's packages and for
# every npm package that depends on it (dsh-base, the other dsh plugins, a community
# plugin), so the whole graph shares one instance: lyteboat's. scripts/upstream-pins.spec.ts
# keeps this list equal to dsh/kernel.json.
overrides:
  "@deepseek-ai/dsh-llm": "workspace:*"
  "@deepseek-ai/dsh-session": "workspace:*"
  "@deepseek-ai/dsh-system-prompt": "workspace:*"
  "@deepseek-ai/dsh-tools": "workspace:*"
  "@deepseek-ai/dsh-skill": "workspace:*"
  "@deepseek-ai/dsh-agent": "workspace:*"
  "@deepseek-ai/dsh-agent-loop": "workspace:*"
  "@deepseek-ai/dsh-session-projection": "workspace:*"
  "@deepseek-ai/dsh-session-persistence": "workspace:*"
  "@deepseek-ai/dsh-session-persistence-jsonl": "workspace:*"
  "@deepseek-ai/dsh-compaction": "workspace:*"
  "@deepseek-ai/dsh-compaction-basic": "workspace:*"
  "@deepseek-ai/dsh-agent-loop-testkit": "workspace:*"
  "@deepseek-ai/dsh-api-session-controller": "workspace:*"
  "@deepseek-ai/dsh-base": "workspace:*"
  "@deepseek-ai/dsh-headless": "workspace:*"
  # The bundler behind tsdown at the version upstream's lockfile resolves, so the kernel
  # bundles (lib/index.js, lib/worker.cjs) come out byte for byte as npm publishes them.
  "rolldown": "1.1.1"

# A promoted kernel package is an importer of its own, and pnpm resolves the peers of its
# dependencies from what that importer declares. session-controller's dependencies reach kernel
# peers it does not declare itself (dsh-subagent wants dsh-system-prompt and dsh-tools;
# dsh-session-query reaches dsh-compaction through dsh-session-format-catalog); without them
# pnpm keeps second copies of dsh-subagent and dsh-session-query for this importer alone, and
# an error class imported from one copy fails `instanceof` against the other. dsh-base's
# dependencies (dsh-session-query, dsh-session-checkpoint-policy) reach dsh-session-persistence
# the same way.
packageExtensions:
  "@deepseek-ai/dsh-api-session-controller":
    peerDependencies:
      "@deepseek-ai/dsh-compaction": "0.2.0-rc.2"
      "@deepseek-ai/dsh-system-prompt": "0.2.0-rc.2"
      "@deepseek-ai/dsh-tools": "0.2.0-rc.2"
  "@deepseek-ai/dsh-base":
    peerDependencies:
      "@deepseek-ai/dsh-compaction": "0.2.0-rc.2"
      "@deepseek-ai/dsh-session-persistence": "0.2.0-rc.2"
      "@deepseek-ai/dsh-system-prompt": "0.2.0-rc.2"
      "@deepseek-ai/dsh-tools": "0.2.0-rc.2"
  "@deepseek-ai/dsh-headless":
    peerDependencies:
      "@deepseek-ai/dsh-compaction": "0.2.0-rc.2"
      "@deepseek-ai/dsh-session-persistence": "0.2.0-rc.2"
      "@deepseek-ai/dsh-system-prompt": "0.2.0-rc.2"
      "@deepseek-ai/dsh-tools": "0.2.0-rc.2"

# An agent directory (`lyteboat headless --agents`) names its rows by bare package name, and they
# resolve from the agent directory upward; the composition tests resolve rows from the
# workspace root. Under pnpm's isolated layout both only reach the dsh and lyteboat packages
# at the root node_modules, so every @deepseek-ai and @lyteboat package is hoisted there. All
# of them are pinned to one version by .pnpmfile.cjs, so hoisting cannot produce a
# version conflict.
publicHoistPattern:
  - "@deepseek-ai/*"
  - "@lyteboat/*"

# Install scripts are opt-in in pnpm 11. Only the node-pty helper chmod is needed on
# Linux/macOS; the rest ship prebuilt binaries or are Windows-only.
allowBuilds:
  "@deepseek-ai/dsh-subprocess-local": true
  esbuild: true
  node-pty: false
  koffi: false
  "@google/genai": false
  protobufjs: false

# Versions shared across the workspace. The dsh and cordis catalogs mirror
# dsh.upstream.json (scripts/upstream-pins.spec.ts keeps them equal); .pnpmfile.cjs
# also pins the transitive dsh-to-dsh ranges the catalogs cannot reach.
catalog:
  "@deepseek-ai/schemastery": "^3.18.4"
  "zod": "^4.6.5"
  "commander": "^15.0.0"
  "js-yaml": "^4.2.0"
  "@types/js-yaml": "^4.0.9"

