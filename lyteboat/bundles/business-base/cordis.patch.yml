# The @lyteboat/business-base bundle patch: the business modes' base, applied
# after dsh-base and @lyteboat/host and before the mode bundle (try,
# serve, eval). A business agent gets only the capabilities its own
# composition declares: an agent that needs a dsh tool lists the tool's row
# in its agent.cordis.yml, where it runs in the agent's standing scope; the
# services behind a tool (web) stay on the host, since an agent row never
# publishes a service.

# The coding tools, and the services only they use.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: fs-observation-policy
  disabled: true
- id: tool-todo
  disabled: true
- id: goal
  disabled: true
- id: goal-round-driver
  disabled: true
- id: command-goal
  disabled: true
- id: tool-goal
  disabled: true
- id: plan-mode
  disabled: true
- id: subagent
  disabled: true
- id: subagent-spawn-in-process
  disabled: true
- id: subagent-fork-in-process
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: ptc-runtime
  disabled: true
- id: workflow-ptc
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-web
  disabled: true
- id: mcp-resources
  disabled: true

# No sandbox and no human approval: without them no `sandbox:policy` or
# `approval:policy` text reaches the model, and a session starts without the
# three permission events. `fs` (the session controller needs it) comes from
# dsh-fs-local instead of the sandboxed backend.
- id: sandbox
  disabled: true
- id: sandbox-policy
  disabled: true
- id: bash-sandbox
  disabled: true
- id: pwsh-sandbox
  disabled: true
- id: fs-sandbox
  disabled: true
- id: shell-env
  disabled: true
- id: subprocess
  disabled: true
- id: approval
  disabled: true
- id: permission
  disabled: true

- insert:
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'

# Large tool results are pruned, not spilled: a spill points the model at a
# file under the system temp directory and at coding tools a business agent
# does not have.
- id: spill-local
  disabled: true
- id: spill-policy
  disabled: true

# The machine stays out of model requests (the working directory's AGENTS.md,
# the installed package list), a running business mode cannot install plugins
# or rewrite its composition, and a user's first message goes to no side call
# for a session title.
- id: agent-instructions
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: plugin-manager
  disabled: true
- id: config-editor
  disabled: true
- id: settings
  disabled: true
- id: session-title-llm
  disabled: true

# Skills come from the agent's own directory only, never from the host's
# default roots.
- id: skill-filesystem
  config:
    includeDefaultRoots: false

# The persona is the agent's; the host adds none, not even the harness's name.
- id: system-prompt
  config:
    personaPrefix: ''
    includeHarnessIdentity: false
