# The @lyteboat/web bundle patch: dsh web with lyteboat's pages, over
# dsh-base, @lyteboat/host, and dsh-web-app (the web profile lists them in
# that order). dsh web's startup row refuses a flag it does not know, so this
# bundle disables it; lyteboat's startup parses dsh web's flags, `--agents`,
# and `--agent`, and provides `webStartup` for dsh web's rows. The agent catalog declares
# every agent of the roots and reloads them when a root changes; one that
# fails is reported on the Agents page instead of stopping the page. The
# web pages answer the browser on dsh's connection. dsh's coding presets
# are turned off: a session runs a lyteboat agent, `--agent` (else the first
# agent of the roots) unless another is picked in dsh web.

- id: web-startup
  disabled: true

- id: preset-standard
  disabled: true

- id: preset-ptc
  disabled: true

- id: preset-minimal
  disabled: true

- id: preset-cordis
  disabled: true

# dsh web moves the agent plane behind its presets. A lyteboat agent runs on
# dsh-base's agent plane and hides what its tool policy does not declare, so
# these rows are back on the host as dsh-base has them (shell by platform; the
# plugin manager tool stays off). lyteboat web does not list the business base: its
# sessions keep dsh's own capabilities, so they do not run as /chat runs them. The workspace's AGENTS.md and
# the package inventory stay out of model requests, as in serve.
- id: tool-bash
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  disabled: !!js process.platform !== 'win32'

- id: tool-jobs
  disabled: false

- id: tool-fs
  disabled: false

- id: tool-fs-search
  disabled: false

- id: skill-filesystem
  disabled: false

- id: tool-skill
  disabled: false

- id: command-goal
  disabled: false

- id: tool-goal
  disabled: false

- id: plan-mode
  disabled: false

- id: compaction-basic
  disabled: false

- id: command-compact
  disabled: false

- id: tool-result-pruner
  disabled: false

- id: tool-subagent-control
  disabled: false

- id: tool-subagent-list-agents
  disabled: false

- id: tool-subagent
  disabled: false

- id: tool-subagent-fork
  disabled: false

- id: workflow-ptc
  disabled: false

- id: tool-workflow
  disabled: false

- id: tool-todo
  disabled: false

- id: tool-web
  disabled: false

- id: agent-instructions
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

# dsh web's Desktop analytics rows turn on in any profile named `desktop`; no
# lyteboat profile ships usage off the machine, so they stay off by name as well.
- id: desktop-product-telemetry
  disabled: true

- id: product-analytics
  disabled: true

- id: agent-preset-registry
  inject: [lyteboatWebStartup]
  config:
    default: !!js ctx.lyteboatWebStartup.defaultAgent

- insert:
    - id: lyteboat-web-startup
      name: '@lyteboat/web/startup'

    - id: agent-catalog
      name: '@lyteboat/agent-catalog'
      inject: [lyteboatWebStartup]
      config:
        roots: !!js ctx.lyteboatWebStartup.agentRoots
        strict: false
        watch: true

    - id: web-pages
      name: '@lyteboat/web-pages'

    - id: lyteboat-web
      name: '@lyteboat/web'
