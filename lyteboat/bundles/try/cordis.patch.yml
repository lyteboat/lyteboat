# The @lyteboat/try bundle patch: one-shot task mode over dsh-base and @lyteboat/base,
# lyteboat's replacement for dsh-headless. The startup row parses the task and the
# `--agent` / `--agents` / `--history` / `--session-id` / `--context` flags from
# the inner arguments, checks that an `--agents` root holds the agent, and
# publishes them as the `lyteboatTryStartup` service; the agent catalog declares
# that agent to the agent preset registry from its root, and the runner row
# creates one agent composed from it (or resumes the stored session), drives the
# task to quiescence, prints the final answer (or, with `--result json`, the turn
# as one object), and exits. The agent loop (lyteboat's kernel) comes from
# dsh-base, and lyteboat's service rows and the business base from
# @lyteboat/base, both listed before this bundle in the try profile.

- insert:
    - id: lyteboat-try-startup
      name: '@lyteboat/try/startup'

    - id: agent-catalog
      name: '@lyteboat/agent-catalog'
      inject: [lyteboatTryStartup]
      config:
        roots: !!js ctx.lyteboatTryStartup.agentRoots
        include: !!js "ctx.lyteboatTryStartup.agent === undefined ? [] : [ctx.lyteboatTryStartup.agent]"

    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      inject: [lyteboatTryStartup]
      config:
        default: !!js ctx.lyteboatTryStartup.agent ?? 'none'

    - id: lyteboat-try
      name: '@lyteboat/try'
      inject: [lyteboatTryStartup]
      config:
        task: !!js ctx.lyteboatTryStartup.task
        agent: !!js ctx.lyteboatTryStartup.agent
        history: !!js ctx.lyteboatTryStartup.history
        sessionId: !!js ctx.lyteboatTryStartup.sessionId
        context: !!js ctx.lyteboatTryStartup.context
        result: !!js ctx.lyteboatTryStartup.result

# A one-shot run applies the user layers at startup only, as dsh-headless does.
- id: hmr
  disabled: true
