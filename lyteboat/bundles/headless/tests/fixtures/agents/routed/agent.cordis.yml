# Dynamic skill routing for every session of this agent. Its definition
# (./agent.mjs) declares the persona, its skills, the router's dynamic mode,
# and makes the official todo_write tool, which the todo row brings, an `auto`
# tool a skill can require.
- id: routed-agent
  name: ./agent.mjs

- id: todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: false
