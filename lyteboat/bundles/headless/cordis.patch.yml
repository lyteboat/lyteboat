# The @lyteboat/headless bundle patch: the business one-shot over dsh-base,
# dsh-headless, and @lyteboat/base. dsh-headless's runner runs the task;
# lyteboat's startup row takes the place of dsh's (it parses dsh's one-shot
# flags and the `--agent` / `--agents` / `--history` / `--context` / `--result`
# flags, checks that an `--agents` root holds the agent, and publishes them as
# the `lyteboatHeadlessStartup` service); the agent catalog declares that agent
# to the agent preset registry from its root; and the `lyteboat-headless` row
# listens to the runner's plans (the kernel extension `headless-hooks`): it
# composes the agent and moves the session into its working directory, seeds
# an imported history, submits the task through the intake guard with its
# request context, and prints the turn with its cards (or, with
# `--result json`, as one object). That row hands the runner its
# `headlessStartup` service only once it listens.

- id: headless-startup
  disabled: true

- insert:
    - id: lyteboat-headless-startup
      name: '@lyteboat/headless/startup'

    - id: agent-catalog
      name: '@lyteboat/agent-catalog'
      inject: [lyteboatHeadlessStartup]
      config:
        roots: !!js ctx.lyteboatHeadlessStartup.agentRoots
        include: !!js "ctx.lyteboatHeadlessStartup.agent === undefined ? [] : [ctx.lyteboatHeadlessStartup.agent]"

    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      inject: [lyteboatHeadlessStartup]
      config:
        default: !!js ctx.lyteboatHeadlessStartup.agent ?? 'none'

    - id: lyteboat-headless
      name: '@lyteboat/headless'
      inject: [lyteboatHeadlessStartup]
      config:
        task: !!js ctx.lyteboatHeadlessStartup.task
        sessionId: !!js ctx.lyteboatHeadlessStartup.sessionId
        json: !!js ctx.lyteboatHeadlessStartup.json
        agent: !!js ctx.lyteboatHeadlessStartup.agent
        history: !!js ctx.lyteboatHeadlessStartup.history
        context: !!js ctx.lyteboatHeadlessStartup.context
        result: !!js ctx.lyteboatHeadlessStartup.result
