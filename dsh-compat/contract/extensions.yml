# lyteboat's additions to the kernel contract, one entry per extension (COMPAT.md §4).
#
# G1 (scripts/dist/contract-check.ts) accepts a difference from the upstream
# snapshot only when its key starts with one of an entry's `contract` keys; a
# listed key that does not differ fails as stale. Keys are the snapshot paths
# joined by ' › ', e.g. `events › @deepseek-ai/dsh-agent-loop › lyteboat/intake` or
# `api › @deepseek-ai/dsh-agent-loop › exports › . › LyteboatIntakeDecision`. Every entry
# is named by at least one `Dist-Change: extend` commit's `Dist-Extension`
# trailer (scripts/dist/delta-report.ts checks it), and the @lyteboat/distro service
# lists the ids at runtime.
#
# Fields: id, package, kind (event | api | api-option | service | config),
# surface (what a plugin sees), contract (keys), exit (the upstream change
# that retires the entry), tests.
extensions:
  - id: agent-loop-intake
    package: '@deepseek-ai/dsh-agent-loop'
    kind: event
    surface: >-
      The `lyteboat/intake` waterfall, dispatched after the inbox claim and before prompt assembly; a
      `reply` answers the claimed messages with an assistant message (source provider `lyteboat`) inside
      one step and no model request. A reply may carry the claimed messages as it logs them (`messages`):
      the same messages in the same order with only `source` changed, or the turn fails. A session's
      first request starts a new request series on every route, so the empty head a reply or a history
      seed leaves is replaced. Exports
      LYTEBOAT_ASSISTANT_PROVIDER, LyteboatIntakeDecision, LyteboatIntakeReply, LyteboatStepPayload.
    contract:
      - events › @deepseek-ai/dsh-agent-loop › lyteboat/intake
      - api › @deepseek-ai/dsh-agent-loop › exports › . › LYTEBOAT_ASSISTANT_PROVIDER
      - api › @deepseek-ai/dsh-agent-loop › exports › . › LyteboatIntakeDecision
      - api › @deepseek-ai/dsh-agent-loop › exports › . › LyteboatIntakeReply
      - api › @deepseek-ai/dsh-agent-loop › exports › . › LyteboatStepPayload
    exit: >-
      Upstream dispatches a pre-assembly waterfall that can answer a step without a model request
      (agent/pre-step fires after assembly and cannot); then @lyteboat plugins listen to it instead.
    tests:
      - dsh/core/agent-loop/tests/lyteboat/intake.spec.ts
  - id: agent-loop-pre-assemble
    package: '@deepseek-ai/dsh-agent-loop'
    kind: event
    surface: >-
      The `lyteboat/pre-assemble` waterfall, dispatched after `lyteboat/intake` passed and before the system
      prompt is assembled, so skill routing and tool activation shape the same step's request.
    contract:
      - events › @deepseek-ai/dsh-agent-loop › lyteboat/pre-assemble
    exit: >-
      Upstream dispatches an event before systemPrompt.assemble that can still change the step's
      prompt and tool set (agent/pre-step fires after assembly).
    tests:
      - dsh/core/agent-loop/tests/lyteboat/pre-assemble.spec.ts
  - id: session-controller-prompt-source
    package: '@deepseek-ai/dsh-api-session-controller'
    kind: api-option
    surface: >-
      SessionPromptRequest takes `sourceFields`, a JSON object whose fields `prompt` adds to the
      source of the user message it appends, beside the ones the controller writes (`kind: 'user'`,
      the request id as `rpcId`, `clientTimeZone`, `principal`); a request that sets one of those fails with
      `gateway/bad-request` before the message reaches the agent. The Typert Host face and Remote
      client accept the field.
    contract:
      - api › @deepseek-ai/dsh-api-session-controller › exports › . › SessionPromptRequest › sourceFields
      - api › @deepseek-ai/dsh-api-session-controller › exports › ./types › SessionPromptRequest › sourceFields
    exit: >-
      Upstream lets a prompt carry a caller's fields onto the source of its user message; then
      @lyteboat plugins pass them that way.
    tests:
      - dsh/api/session-controller/tests/lyteboat/prompt-source.host.spec.ts
