# manifest.yaml — doctor_jump_card: a card that stays in the conversation and
# takes the doctor back to a page when clicked; `go` is the intent it sends
# again ({ kind: "doctor.ui.<intent>", ...payload }).
# The raw data namespace: { icon, title, sub, go }.

emission_mode: immediate

paths:

  icon:
    kind: state
    path: "icon"

  title:
    kind: state
    path: "title"

  sub:
    kind: state
    path: "sub"

  go:
    kind: state
    path: "go"
