# manifest.yaml — doctor_ui_intent: one command for the doctor workbench, which
# applies it when the card arrives (switch the page, filter a list, open a
# prefilled modal). Nothing is drawn for it.
# The raw data namespace: { kind: "doctor.ui.<intent>", payload: { ... } }.

emission_mode: immediate

paths:

  kind:
    kind: state
    path: "kind"

  payload:
    kind: state
    path: "payload"
